[package]
name = "demo-parser"
version = "0.1.0"
edition = "2021"
description = "Demo WASM plugin for rocksdb-tui demonstrating key-based routing and format-based parsing"

[lib]
crate-type = ["cdylib"]

[dependencies]
rocksdb-tui-plugin-sdk = { path = "../rocksdb-tui-plugin-sdk" }
demo-types = { path = "../demo-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
