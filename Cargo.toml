[package]
name = "rocksdb-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
rocksdb = "0.22"
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
