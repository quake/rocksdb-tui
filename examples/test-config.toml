[[column_families]]
name = "default"
key_schema = "string"
value_format = "string"

[[column_families]]
name = "users"
key_schema = "string"
value_format = "json"

# Demonstrates u8le key_schema (log sequence number as u64)
[[column_families]]
name = "logs"
key_schema = "u8le"
value_format = "string"

# Demonstrates hex key_schema (binary hash keys)
[[column_families]]
name = "cache"
key_schema = "hex"
value_format = "msgpack"

[[column_families]]
name = "orders"
key_schema = "string"
value_format = "protobuf"
proto_file = "examples/protos/order.proto"
proto_message = "Order"

[[column_families]]
name = "accounts"
key_schema = "string"
value_format = "molecule"
mol_file = "examples/molecules/types.mol"
mol_type = "Account"

# Demonstrates composite binary key format
[[column_families]]
name = "blocks"
key_schema = """
seq:
  - id: block_num
    type: u8le
  - id: tx_index
    type: u4le
"""
value_format = "json"

# Demonstrates value_schema for binary structured values
[[column_families]]
name = "metrics"
key_schema = "string"
value_schema = """
seq:
  - id: timestamp
    type: u8le
  - id: value
    type: u8le
  - id: flags
    type: u4le
"""

# WASM Plugin Configuration
# Build: cargo build --release --target wasm32-unknown-unknown -p demo-parser
# The plugin is located at: examples/demo_parser.wasm
[plugins]
wasm = ["examples/demo_parser.wasm"]

# ========================================
# Mode 1: Key-prefix routing (single CF)
# ========================================
# All data in one CF, key prefix determines value type:
# - 0x00: Product
# - 0x01: Customer  
# - 0x02: Transaction
[[column_families]]
name = "demo"
key_schema = "hex"
value_format = "demo"

# ========================================
# Mode 2: Format-based routing (multi CF)
# ========================================
# Each CF has its own format, no key prefix needed

[[column_families]]
name = "products"
key_schema = "u4le"
value_format = "demo.Product"

[[column_families]]
name = "customers"
key_schema = "u4le"
value_format = "demo.Customer"

[[column_families]]
name = "transactions"
key_schema = "u4le"
value_format = "demo.Transaction"
