# Fiber Network RocksDB configuration for rocksdb-tui
# Usage: rocksdb-tui --db /path/to/fiber/store --config examples/fiber/config.toml
#
# Fiber Network uses a single column family with 1-byte key prefixes to
# distinguish different data types. The WASM plugin handles routing based
# on the key prefix.
#
# Key format: [prefix: 1 byte][type-specific key data]
# The plugin inspects key[0] to determine how to parse the value.
#
# To use this config:
# 1. Build the fiber-parser WASM plugin (see crates/fiber-parser/)
# 2. Copy the .wasm file to ~/.config/rocksdb-tui/plugins/
# 3. Run: rocksdb-tui --db /path/to/fiber/store --config examples/fiber/config.toml

[plugins]
wasm = [
    "~/.config/rocksdb-tui/plugins/fiber-parser.wasm"
]

# Fiber uses a single default column family with prefix-based routing
[[column_families]]
name = "default"
key_schema = "hex"           # Show key as hex (includes prefix byte)
value_format = "fiber"       # Plugin routes by key[0] prefix

# Known key prefixes in Fiber (for reference):
# 0x00 - Channel actor state
# 0x01 - Payment sessions  
# 0x02 - Peer info
# 0x03 - Channel announcements
# 0x04 - Node announcements
# 0x05 - Invoices
# 0x06 - Watchtower data
# 0x07 - Graph nodes
# 0x08 - Graph edges
# ... (see Fiber source for complete list)
