[package]
name = "fiber-parser"
version = "0.1.0"
edition = "2021"
description = "Fiber Network WASM plugin for rocksdb-tui"

[lib]
crate-type = ["cdylib"]

[dependencies]
rocksdb-tui-plugin-sdk = { path = "../../../plugin-sdk" }
fiber-types = { path = "../fiber-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
